# Member Portal is mounted at the generic Business route /member (no member-specific path).
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /member/runtime-config.json {
    add_header Cache-Control "no-store, max-age=0" always;
    expires -1;
    try_files $uri =404;
  }

  location ^~ /member/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /member/index.html {
    add_header Cache-Control "no-store, max-age=0" always;
    expires -1;
    try_files $uri =404;
  }

  location = /member {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files /member/index.html =404;
  }

  location ^~ /member/ {
    try_files $uri $uri/ /member/index.html;
  }

  location / {
    return 404;
  }
}
