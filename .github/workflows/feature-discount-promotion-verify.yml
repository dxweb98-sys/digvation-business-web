name: Discount promotion verification

on:
  push:
    branches: [feat/discount-promotion]

permissions:
  contents: read

concurrency:
  group: discount-promotion-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Contract check
        run: pnpm contract:check
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm build
