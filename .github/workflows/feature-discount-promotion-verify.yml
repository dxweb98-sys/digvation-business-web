name: Discount promotion verification

on:
  push:
    branches: [feat/discount-promotion]

permissions:
  contents: read

concurrency:
  group: discount-promotion-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Contract check
        run: pnpm contract:check
      - name: Feature format check
        run: >-
          pnpm exec prettier --check
          apps/backoffice/src/modules/promotions/*.ts
          apps/backoffice/src/modules/promotions/*.tsx
          apps/operational/src/features/sell/cart-draft.ts
          apps/operational/src/features/sell/cart-draft.test.ts
          apps/operational/src/features/sell/cashier-transaction.types.ts
          apps/operational/src/features/sell/operational-projection-client.ts
          apps/operational/src/features/sell/use-sale-workspace-controller.ts
          apps/operational/src/features/sell/components/sale-adjustment-controls.tsx
      - name: Feature lint
        run: >-
          pnpm exec eslint
          apps/backoffice/src/modules/promotions/promotions-api.ts
          apps/backoffice/src/modules/promotions/promotions-localization.ts
          apps/backoffice/src/modules/promotions/promotions-page.tsx
          apps/operational/src/features/sell/cart-draft.ts
          apps/operational/src/features/sell/cart-draft.test.ts
          apps/operational/src/features/sell/cashier-transaction.types.ts
          apps/operational/src/features/sell/operational-projection-client.ts
          apps/operational/src/features/sell/use-sale-workspace-controller.ts
          apps/operational/src/features/sell/components/sale-adjustment-controls.tsx
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm build
