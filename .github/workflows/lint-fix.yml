name: Temporary Lint Fix

on:
  push:
    branches:
      - fix/ci-formatting

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-bot]') && !contains(github.event.head_commit.message, '[remove-lint-workflow]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply targeted lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          providers = Path('apps/operational/src/app/providers/operational-providers.tsx')
          text = providers.read_text()
          old = """  useEffect(() => {\n    let active = true;\n    setState('loading');\n    setEffectiveRuntime(null);\n    setAvailability(null);\n    void (async () => {\n"""
          new = """  useEffect(() => {\n    let active = true;\n    void (async () => {\n"""
          if old not in text:
              raise SystemExit('provider reset pattern not found')
          text = text.replace(old, new, 1)
          old = """      <AuthenticatedOperationalRuntime>\n"""
          new = """      <AuthenticatedOperationalRuntime\n        key={`${authenticatedSession.identity.userId}:${runtime.apiBaseUrl}`}\n      >\n"""
          if old not in text:
              raise SystemExit('provider runtime boundary pattern not found')
          providers.write_text(text.replace(old, new, 1))

          workspace = Path('apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx')
          text = workspace.read_text()
          old = "function queueStatus(sale: Sale, includeOpenSales = false): QueueStatus | null {"
          if old not in text:
              raise SystemExit('queueStatus pattern not found')
          text = text.replace(old, "function queueStatus(sale: Sale): QueueStatus | null {", 1)
          text = text.replace('queueStatus(record, isLocalDemo)', 'queueStatus(record)')
          old = "  const [queueIssues, setQueueIssues] = useState<Record<string, string[]>>({});"
          if old not in text:
              raise SystemExit('queueIssues pattern not found')
          text = text.replace(old, "  const [queueIssues] = useState<Record<string, string[]>>({});", 1)
          workspace.write_text(text)
          PY

      - name: Format touched files
        run: pnpm exec prettier --write apps/operational/src/app/providers/operational-providers.tsx apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operational/src/app/providers/operational-providers.tsx apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx
          if git diff --cached --quiet; then
            echo "No lint changes required."
            exit 0
          fi
          git commit -m "fix(operational): resolve frontend lint blockers [lint-bot]"
          git push origin HEAD:${{ github.ref_name }}
