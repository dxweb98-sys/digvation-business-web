name: Publish Production Web Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without v prefix (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-web-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout exact stage revision
        uses: actions/checkout@v4

      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must use MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify web workspace
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm verify

      - name: Build immutable production images
        run: |
          set -euo pipefail
          SHA='${{ github.sha }}'
          docker build --target backoffice --build-arg BUILD_REVISION="$SHA" --tag "dgv-backoffice:$SHA" .
          docker build --target operational --build-arg BUILD_REVISION="$SHA" --tag "dgv-operational:$SHA" .
          docker build --target member-portal --build-arg BUILD_REVISION="$SHA" --tag "dgv-member:$SHA" .

      - name: Verify image identity
        run: |
          set -euo pipefail
          SHA='${{ github.sha }}'
          for image in dgv-backoffice dgv-operational dgv-member; do
            actual="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:$SHA")"
            test "$actual" = "$SHA"
          done

      - name: Container health smoke
        run: |
          set -euo pipefail
          SHA='${{ github.sha }}'

          docker run -d --name dgv-backoffice-smoke -p 18081:8080 "dgv-backoffice:$SHA"
          docker run -d --name dgv-operational-smoke -p 18082:8080 "dgv-operational:$SHA"
          docker run -d --name dgv-member-smoke -p 18083:8080 "dgv-member:$SHA"

          cleanup() {
            docker rm -f dgv-backoffice-smoke dgv-operational-smoke dgv-member-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for port in 18081 18082 18083; do
            ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:$port/healthz" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            test "$ready" = true
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse existing immutable release tags
        run: |
          set -euo pipefail
          SHA='${{ github.sha }}'
          VERSION='${{ env.VERSION }}'
          tags=(
            "v$VERSION-backoffice-$SHA"
            "v$VERSION-operational-$SHA"
            "v$VERSION-member-portal-$SHA"
          )

          for tag in "${tags[@]}"; do
            if docker buildx imagetools inspect "${IMAGE}:${tag}" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing immutable tag: ${IMAGE}:${tag}"
              exit 1
            fi
          done

      - name: Push immutable production images
        run: |
          set -euo pipefail
          SHA='${{ github.sha }}'
          VERSION='${{ env.VERSION }}'

          docker tag "dgv-backoffice:$SHA" "${IMAGE}:v$VERSION-backoffice-$SHA"
          docker tag "dgv-operational:$SHA" "${IMAGE}:v$VERSION-operational-$SHA"
          docker tag "dgv-member:$SHA" "${IMAGE}:v$VERSION-member-portal-$SHA"

          docker push "${IMAGE}:v$VERSION-backoffice-$SHA"
          docker push "${IMAGE}:v$VERSION-operational-$SHA"
          docker push "${IMAGE}:v$VERSION-member-portal-$SHA"

      - name: Release summary
        run: |
          {
            echo "## Web production release"
            echo
            echo "- Version: v${VERSION}"
            echo "- Revision: ${GITHUB_SHA}"
            echo "- Backoffice: \`${IMAGE}:v${VERSION}-backoffice-${GITHUB_SHA}\`"
            echo "- Operational: \`${IMAGE}:v${VERSION}-operational-${GITHUB_SHA}\`"
            echo "- Member Portal: \`${IMAGE}:v${VERSION}-member-portal-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
