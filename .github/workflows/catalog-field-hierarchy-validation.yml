name: Catalog Field Hierarchy Validation

on:
  push:
    branches:
      - refactor/catalog-reference-architecture

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check && pnpm naming:check
      - run: pnpm exec eslint apps/backoffice/src/features/catalog apps/backoffice/src/shared
      - run: pnpm --filter @digvation/business-backoffice typecheck
      - run: pnpm exec vitest run apps/backoffice/src/features/catalog apps/backoffice/src/shared
      - env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm build:backoffice
