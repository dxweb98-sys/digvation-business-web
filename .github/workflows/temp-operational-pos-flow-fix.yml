name: Temporary Operational POS Flow Fix

on:
  push:
    branches:
      - feat/operational-api-integration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operational-api-integration
          fetch-depth: 0
      - name: Apply targeted POS flow fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          """  useEffect(() => {\n    writeStoredCustomer(CURRENT_CUSTOMER_KEY, cartCustomer);\n    if (sale?.id) writeStoredCustomer(saleCustomerKey(sale.id), cartCustomer);\n  }, [cartCustomer, sale?.id]);""",
          """  useEffect(() => {\n    writeStoredCustomer(CURRENT_CUSTOMER_KEY, cartCustomer);\n  }, [cartCustomer]);""",
          'customer storage effect',
          )

          replace_once(
          """  const openAdjustment = (transaction: Sale) => {\n    if (transaction.status !== 'OPEN') return;\n    setQueueDetail(null);\n    setAdjustmentTarget(transaction);\n    workspace.resumeSale(transaction.id);\n  };""",
          """  const openAdjustment = (transaction: Sale) => {\n    if (transaction.status !== 'OPEN') return;\n    setQueueDetail(null);\n    setAdjustmentTarget(transaction);\n    workspace.openQueueContext(transaction.id);\n  };""",
          'open adjustment',
          )

          replace_once(
          """    setCancelTarget(transaction);\n    setCancelReason('');\n    workspace.resumeSale(transaction.id);""",
          """    setCancelTarget(transaction);\n    setCancelReason('');""",
          'cancel request queue resume',
          )

          replace_once(
          """    if (sale?.id !== cancelTarget.id) {\n      workspace.resumeSale(cancelTarget.id);\n      return;\n    }\n    try {\n      const canceledSale = await workspace.voidSale();""",
          """    try {\n      const canceledSale = await workspace.voidQueuedSale(cancelTarget);""",
          'cancel command',
          )

          replace_once(
          """      workspace.clearProcessedDraft();\n      showToast({\n        title: copy('Transaction canceled'),""",
          """      workspace.closeQueueContext();\n      showToast({\n        title: copy('Transaction canceled'),""",
          'cancel close queue context',
          )

          replace_once(
          """  const payQueueBalance = async () => {\n    const transaction = displayedQueuePaymentTarget;\n    if (!transaction || sale?.id !== transaction.id || !queuePaymentAmount) return;""",
          """  const payQueueBalance = async () => {\n    const transaction = displayedQueuePaymentTarget;\n    if (!transaction || !queuePaymentAmount) return;""",
          'queue payment guard',
          )

          replace_once(
          """      const updatedSale = await workspace.createPayment(\n        paymentMethod,\n        due,\n        paymentMethod === 'CASH' ? applied : undefined,\n        provider || undefined,\n      );""",
          """      const updatedSale = await workspace.createQueuedPayment(\n        transaction,\n        paymentMethod,\n        due,\n        paymentMethod === 'CASH' ? applied : undefined,\n        provider || undefined,\n      );""",
          'queue payment command',
          )

          replace_once(
          """      workspace.clearProcessedDraft();\n      showToast({\n        title: hasSuccessfulCheckout(updatedSale)""",
          """      workspace.closeQueueContext();\n      showToast({\n        title: hasSuccessfulCheckout(updatedSale)""",
          'queue payment close context',
          )

          replace_once(
          """        onChoose={(customer) => {\n          setCartCustomer(customer);\n          setCustomerPickerOpen(false);\n        }}\n        onUseGeneralCustomer={() => {\n          setCartCustomer(null);\n          setCustomerPickerOpen(false);\n        }}""",
          """        onChoose={(customer) => {\n          setCartCustomer(customer);\n          if (sale?.id) writeStoredCustomer(saleCustomerKey(sale.id), customer);\n          setCustomerPickerOpen(false);\n        }}\n        onUseGeneralCustomer={() => {\n          setCartCustomer(null);\n          if (sale?.id) writeStoredCustomer(saleCustomerKey(sale.id), null);\n          setCustomerPickerOpen(false);\n        }}""",
          'customer selection persistence',
          )

          replace_once(
          """        onClose={() => {\n          workspace.closeVariantPicker();\n          setAdjustmentTarget(null);\n          workspace.clearProcessedDraft();\n        }}""",
          """        onClose={() => {\n          workspace.closeVariantPicker();\n          setAdjustmentTarget(null);\n          workspace.closeQueueContext();\n        }}""",
          'adjustment close context',
          )

          replace_once(
          """        onClose={() => {\n          setQueuePaymentTarget(null);\n          setQueuePaymentAmount(null);\n          workspace.clearProcessedDraft();\n        }}""",
          """        onClose={() => {\n          setQueuePaymentTarget(null);\n          setQueuePaymentAmount(null);\n          workspace.closeQueueContext();\n        }}""",
          'payment close context',
          )

          replace_once(
          """        onClose={() => setCancelTarget(null)}\n        onConfirm={confirmCancel}""",
          """        onClose={() => {\n          setCancelTarget(null);\n          workspace.closeQueueContext();\n        }}\n        onConfirm={confirmCancel}""",
          'cancel dialog close',
          )

          replace_once(
          """    ...(status === 'PROGRESS'\n      ? [\n          ...(isPositiveDecimal(balanceDue)""",
          """    ...(status === 'PROGRESS'\n      ? [\n          {\n            label: copy('Adjust order'),\n            icon: <ShoppingBag className=\"size-3.5\" />,\n            onSelect: () => onAdjust(sale),\n          },\n          ...(isPositiveDecimal(balanceDue)""",
          'progress adjustment action',
          )

          path.write_text(text)
          PY

          rm .github/workflows/temp-operational-pos-flow-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx .github/workflows/temp-operational-pos-flow-fix.yml
          git commit -m "fix(operational): stabilize queue and customer flow"
          git push origin HEAD:feat/operational-api-integration
