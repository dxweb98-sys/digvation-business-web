name: Temporary Typecheck Fix

on:
  push:
    branches:
      - fix/ci-formatting

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[typecheck-bot]') && !contains(github.event.head_commit.message, '[remove-typecheck-workflow]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply targeted type fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Runtime already defines ConnectivityState; expose it through the package public API.
          runtime_index = Path('packages/runtime/src/index.ts')
          text = runtime_index.read_text()
          marker = "export { ConnectivityProvider, useConnectivity } from './connectivity-context';\n"
          if marker not in text:
              raise SystemExit('runtime connectivity export marker not found')
          if "export type { ConnectivityState } from './connectivity-context';" not in text:
              text = text.replace(
                  marker,
                  marker + "export type { ConnectivityState } from './connectivity-context';\n",
                  1,
              )
          runtime_index.write_text(text)

          # Local demo implements the same payment-routing boundary as HTTP.
          local_adapter = Path('apps/operational/src/features/sell/local-cashier-transaction.adapter.ts')
          text = local_adapter.read_text()
          old = """  Payment,\n  ResolvedPrice,\n"""
          new = """  Payment,\n  PaymentRoute,\n  ResolvedPrice,\n"""
          if old not in text:
              raise SystemExit('local adapter Payment import marker not found')
          text = text.replace(old, new, 1)
          insert_after = """  public async listSellingLocations(): Promise<ApiPage<SellingLocation>> {\n    return page([this.location]);\n  }\n\n"""
          method = """  public async listPaymentRoutes(input: {\n    sellingLocationId: string;\n    currency: string;\n  }): Promise<ApiPage<PaymentRoute>> {\n    if (input.sellingLocationId !== this.location.id) return page([]);\n    const time = timestamp();\n    return page([\n      {\n        id: 'demo-payment-route-cash',\n        sellingLocationId: this.location.id,\n        paymentMethod: 'CASH',\n        currency: input.currency,\n        financialAccountId: 'demo-cash-account',\n        financialAccountCode: 'CASH',\n        financialAccountName: 'Demo Cash',\n        status: 'ACTIVE',\n        version: 1,\n        createdAt: time,\n        updatedAt: time,\n      },\n    ]);\n  }\n\n"""
          if insert_after not in text:
              raise SystemExit('local adapter location method marker not found')
          if 'public async listPaymentRoutes(' not in text:
              text = text.replace(insert_after, insert_after + method, 1)
          local_adapter.write_text(text)

          # AuthPort token getter is optional by contract.
          for file_name in [
              'apps/operational/src/features/sell/use-cashier-transaction-workspace.ts',
              'apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx',
          ]:
              path = Path(file_name)
              text = path.read_text()
              old = 'authPort.getAccessToken.bind(authPort)'
              if old not in text:
                  raise SystemExit(f'optional token getter marker not found in {file_name}')
              path.write_text(text.replace(old, 'authPort.getAccessToken?.bind(authPort)', 1))

          # One detail call still passed the removed, previously-unused demo flag.
          workspace = Path('apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx')
          text = workspace.read_text()
          old = 'const status = queueStatus(sale, isLocalDemo);'
          if old not in text:
              raise SystemExit('stale queueStatus call not found')
          workspace.write_text(text.replace(old, 'const status = queueStatus(sale);', 1))

          # DSelect can emit string | number | null; normalize back to this form's string state.
          expense = Path('apps/operational/src/modules/finance/operational-expenses-page.tsx')
          text = expense.read_text()
          old = '            onValueChange={setFinancialAccountId}\n'
          new = "            onValueChange={(value) => setFinancialAccountId(String(value ?? ''))}\n"
          if old not in text:
              raise SystemExit('expense select callback marker not found')
          expense.write_text(text.replace(old, new, 1))
          PY

      - name: Format touched files
        run: pnpm exec prettier --write packages/runtime/src/index.ts apps/operational/src/features/sell/local-cashier-transaction.adapter.ts apps/operational/src/features/sell/use-cashier-transaction-workspace.ts apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx apps/operational/src/modules/finance/operational-expenses-page.tsx

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/runtime/src/index.ts apps/operational/src/features/sell/local-cashier-transaction.adapter.ts apps/operational/src/features/sell/use-cashier-transaction-workspace.ts apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx apps/operational/src/modules/finance/operational-expenses-page.tsx
          if git diff --cached --quiet; then
            echo "No typecheck changes required."
            exit 0
          fi
          git commit -m "fix(operational): resolve frontend typecheck blockers [typecheck-bot]"
          git push origin HEAD:${{ github.ref_name }}
