name: Temporary E2E Auth Fixture Fix

on:
  push:
    branches:
      - fix/ci-formatting

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[e2e-auth-bot]') && !contains(github.event.head_commit.message, '[remove-e2e-auth-workflow]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Patch authenticated browser-session fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tooling/e2e/cashier-transaction-foundation.spec.ts')
          text = path.read_text()

          marker = """async function installRoutes(page: Page, options: Partial<RouteState> = {}) {\n  const state: RouteState = {\n"""
          replacement = """async function installRoutes(page: Page, options: Partial<RouteState> = {}) {\n  await page.addInitScript(() => {\n    const prefix = 'digvation.operational.auth-session.v2';\n    window.sessionStorage.setItem(`${prefix}.access-token`, 'e2e-access-token');\n    window.sessionStorage.setItem(`${prefix}.access-expires-at`, '2099-01-01T00:00:00.000Z');\n    window.sessionStorage.setItem(`${prefix}.last-activity`, String(Date.now()));\n  });\n\n  const state: RouteState = {\n"""
          if marker not in text:
              raise SystemExit('installRoutes marker not found')
          if "digvation.operational.auth-session.v2" not in text:
              text = text.replace(marker, replacement, 1)

          route_marker = """    if (method === 'GET' && url.pathname === '/api/v1/runtime/context') {\n"""
          auth_block = """    if (method === 'GET' && url.pathname === '/api/v1/auth/me') {\n      await route.fulfill({\n        json: envelope({\n          id: 'e2e-operational-user',\n          displayName: 'E2E Operational User',\n          roles: [{ permissions: ['sales:create', 'sales:read'] }],\n        }),\n      });\n      return;\n    }\n"""
          if route_marker not in text:
              raise SystemExit('runtime context marker not found')
          if "url.pathname === '/api/v1/auth/me'" not in text:
              text = text.replace(route_marker, auth_block + route_marker, 1)

          path.write_text(text)
          PY
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tooling/e2e/cashier-transaction-foundation.spec.ts
      - name: Commit fixture fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/e2e/cashier-transaction-foundation.spec.ts
          git commit -m "test(operational): seed authenticated browser session [e2e-auth-bot]"
          git push origin HEAD:${{ github.ref_name }}
