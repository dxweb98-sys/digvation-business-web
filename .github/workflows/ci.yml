name: Frontend CI

on:
  pull_request:
    branches: [dev, main, stage]
  push:
    branches: [dev, main, stage]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify foundation
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm verify

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm test:e2e

      - name: Build immutable Backoffice and Operational images
        run: |
          docker build --target backoffice --build-arg BUILD_REVISION=${{ github.sha }} --tag business-backoffice-ci:${{ github.sha }} .
          docker build --target operational --build-arg BUILD_REVISION=${{ github.sha }} --tag business-operational-ci:${{ github.sha }} .

      - name: Verify web image identity
        run: |
          test "$(docker inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' business-backoffice-ci:${{ github.sha }})" = "${{ github.sha }}"
          test "$(docker inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' business-operational-ci:${{ github.sha }})" = "${{ github.sha }}"

      - name: Web container routing and runtime-config smoke
        run: |
          docker run --detach --name business-backoffice-smoke --publish 18081:8080 \
            --volume "$PWD/deployment/runtime-config.example.json:/usr/share/nginx/html/runtime-config.json:ro" \
            business-backoffice-ci:${{ github.sha }}
          docker run --detach --name business-operational-smoke --publish 18082:8080 \
            --volume "$PWD/deployment/runtime-config.example.json:/usr/share/nginx/html/runtime-config.json:ro" \
            business-operational-ci:${{ github.sha }}

          for port in 18081 18082; do
            ready=false
            for attempt in $(seq 1 20); do
              if curl --fail --silent "http://127.0.0.1:${port}/healthz"; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
            curl --fail --silent "http://127.0.0.1:${port}/login" >/dev/null
            curl --fail --silent "http://127.0.0.1:${port}/runtime-config.json" >/dev/null
            curl --fail --silent --head "http://127.0.0.1:${port}/runtime-config.json" | grep -i '^cache-control: no-store'
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/api/v1/session/context")" = 404
          done

          test "$(docker exec business-backoffice-smoke id -u)" != 0
          test "$(docker exec business-operational-smoke id -u)" != 0

      - name: Web container diagnostics and cleanup
        if: always()
        run: |
          docker logs business-backoffice-smoke 2>/dev/null || true
          docker logs business-operational-smoke 2>/dev/null || true
          docker rm --force business-backoffice-smoke business-operational-smoke 2>/dev/null || true


  production-release-artifacts:
    name: production-release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all production web images
        run: |
          SHA=${{ github.sha }}
          docker build --target backoffice --build-arg BUILD_REVISION="$SHA" --tag web-backoffice-release:$SHA .
          docker build --target operational --build-arg BUILD_REVISION="$SHA" --tag web-operational-release:$SHA .
          docker build --target member-portal --build-arg BUILD_REVISION="$SHA" --tag web-member-release:$SHA .

      - name: Verify production web image identities
        run: |
          SHA=${{ github.sha }}
          for image in web-backoffice-release web-operational-release web-member-release; do
            test "$(docker inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' ${image}:$SHA)" = "$SHA"
          done

      - name: Smoke production web containers
        run: |
          set -euo pipefail
          SHA=${{ github.sha }}

          docker run -d --name web-backoffice-release-smoke -p 18081:8080 web-backoffice-release:$SHA
          docker run -d --name web-operational-release-smoke -p 18082:8080 web-operational-release:$SHA
          docker run -d --name web-member-release-smoke -p 18083:8080 web-member-release:$SHA

          cleanup() {
            docker rm -f web-backoffice-release-smoke web-operational-release-smoke web-member-release-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for port in 18081 18082 18083; do
            ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:$port/healthz" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            test "$ready" = true
          done
