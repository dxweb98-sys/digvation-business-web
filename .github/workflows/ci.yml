name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply scoped task fixes and formatting
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(path, from, to) {
            const current = fs.readFileSync(path, 'utf8');
            if (current.includes(to)) return;
            if (!current.includes(from)) throw new Error(`Expected source text not found in ${path}`);
            fs.writeFileSync(path, current.replace(from, to));
          }

          function replaceAllRequired(path, from, to) {
            const current = fs.readFileSync(path, 'utf8');
            if (current.includes(to) && !current.includes(from)) return;
            if (!current.includes(from)) throw new Error(`Expected source text not found in ${path}`);
            fs.writeFileSync(path, current.split(from).join(to));
          }

          replaceRequired(
            'apps/operational/src/features/sell/use-cashier-transaction-workspace.ts',
            "      throw new Error(copy('The latest transaction could not be loaded.'));",
            "      throw new Error(copy('The latest transaction could not be loaded.'), { cause: error });",
          );

          const historyPath = 'apps/operational/src/modules/pos/operational-transaction-history-page.tsx';
          replaceRequired(
            historyPath,
            '            sale={detail.data}\n            locale={locale}\n            text={text}',
            '            sale={detail.data}\n            text={text}',
          );
          replaceRequired(
            historyPath,
            'function TransactionDetail({\n  sale,\n  locale,\n  text,',
            'function TransactionDetail({\n  sale,\n  text,',
          );
          replaceRequired(
            historyPath,
            '  sale: OperationalSaleDetail;\n  locale: string;\n  text:',
            '  sale: OperationalSaleDetail;\n  text:',
          );
          replaceAllRequired(
            historyPath,
            "saleTaxLabel(sale, text('Pajak', 'Tax'))",
            "saleTaxLabel(sale, text('Pajak', 'Tax'), text('Pajak termasuk', 'Tax included'))",
          );

          replaceAllRequired(
            'apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx',
            "saleTaxLabel(sale, copy('Tax'))",
            "saleTaxLabel(sale, copy('Tax'), copy('Tax included'))",
          );

          replaceRequired(
            'apps/operational/src/features/sell/sale-presentation.test.ts',
            "    expect(saleTaxLabel(sale, 'Tax')).toBe('Tax included (11%)');",
            "    expect(saleTaxLabel(sale, 'Tax', 'Tax included')).toBe('Tax included (11%)');",
          );
          NODE

          pnpm exec prettier --write \
            apps/operational/src/app/localization/operational-pos-copy.ts \
            apps/operational/src/features/sell/cart-draft.test.ts \
            apps/operational/src/features/sell/cart-draft.ts \
            apps/operational/src/features/sell/cashier-transaction.types.ts \
            apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx \
            apps/operational/src/features/sell/components/sale-line-row.tsx \
            apps/operational/src/features/sell/components/sale-line-task-dialog.tsx \
            apps/operational/src/features/sell/sale-presentation.test.ts \
            apps/operational/src/features/sell/sale-presentation.ts \
            apps/operational/src/features/sell/use-cashier-transaction-workspace.ts \
            apps/operational/src/modules/finance/operational-expenses-page.tsx \
            apps/operational/src/modules/pos/operational-transaction-history-page.tsx \
            apps/operational/src/modules/pos/transaction-history-api.ts

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              apps/operational/src/app/localization/operational-pos-copy.ts \
              apps/operational/src/features/sell/cart-draft.test.ts \
              apps/operational/src/features/sell/cart-draft.ts \
              apps/operational/src/features/sell/cashier-transaction.types.ts \
              apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx \
              apps/operational/src/features/sell/components/sale-line-row.tsx \
              apps/operational/src/features/sell/components/sale-line-task-dialog.tsx \
              apps/operational/src/features/sell/sale-presentation.test.ts \
              apps/operational/src/features/sell/sale-presentation.ts \
              apps/operational/src/features/sell/use-cashier-transaction-workspace.ts \
              apps/operational/src/modules/finance/operational-expenses-page.tsx \
              apps/operational/src/modules/pos/operational-transaction-history-page.tsx \
              apps/operational/src/modules/pos/transaction-history-api.ts
            git commit -m 'fix(operational): close presentation validation gaps'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Verify scoped implementation
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: |
          pnpm contract:check
          pnpm exec prettier --check \
            apps/operational/src/app/localization/operational-pos-copy.ts \
            apps/operational/src/features/sell/cart-draft.test.ts \
            apps/operational/src/features/sell/cart-draft.ts \
            apps/operational/src/features/sell/cashier-transaction.types.ts \
            apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx \
            apps/operational/src/features/sell/components/sale-line-row.tsx \
            apps/operational/src/features/sell/components/sale-line-task-dialog.tsx \
            apps/operational/src/features/sell/sale-presentation.test.ts \
            apps/operational/src/features/sell/sale-presentation.ts \
            apps/operational/src/features/sell/use-cashier-transaction-workspace.ts \
            apps/operational/src/modules/finance/operational-expenses-page.tsx \
            apps/operational/src/modules/pos/operational-transaction-history-page.tsx \
            apps/operational/src/modules/pos/transaction-history-api.ts
          pnpm exec eslint \
            apps/operational/src/app/localization/operational-pos-copy.ts \
            apps/operational/src/features/sell/cart-draft.test.ts \
            apps/operational/src/features/sell/cart-draft.ts \
            apps/operational/src/features/sell/cashier-transaction.types.ts \
            apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx \
            apps/operational/src/features/sell/components/sale-line-row.tsx \
            apps/operational/src/features/sell/components/sale-line-task-dialog.tsx \
            apps/operational/src/features/sell/sale-presentation.test.ts \
            apps/operational/src/features/sell/sale-presentation.ts \
            apps/operational/src/features/sell/use-cashier-transaction-workspace.ts \
            apps/operational/src/modules/finance/operational-expenses-page.tsx \
            apps/operational/src/modules/pos/operational-transaction-history-page.tsx \
            apps/operational/src/modules/pos/transaction-history-api.ts
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm test:e2e

      - name: Build immutable Backoffice and Operational images
        run: |
          docker build --target backoffice --build-arg BUILD_REVISION=${{ github.sha }} --tag business-backoffice-ci:${{ github.sha }} .
          docker build --target operational --build-arg BUILD_REVISION=${{ github.sha }} --tag business-operational-ci:${{ github.sha }} .

      - name: Verify web image identity
        run: |
          test "$(docker inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' business-backoffice-ci:${{ github.sha }})" = "${{ github.sha }}"
          test "$(docker inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' business-operational-ci:${{ github.sha }})" = "${{ github.sha }}"

      - name: Web container routing and runtime-config smoke
        run: |
          docker run --detach --name business-backoffice-smoke --publish 18081:8080 \
            --volume "$PWD/deployment/runtime-config.example.json:/usr/share/nginx/html/runtime-config.json:ro" \
            business-backoffice-ci:${{ github.sha }}
          docker run --detach --name business-operational-smoke --publish 18082:8080 \
            --volume "$PWD/deployment/runtime-config.example.json:/usr/share/nginx/html/runtime-config.json:ro" \
            business-operational-ci:${{ github.sha }}

          for port in 18081 18082; do
            ready=false
            for attempt in $(seq 1 20); do
              if curl --fail --silent "http://127.0.0.1:${port}/healthz"; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true
            curl --fail --silent "http://127.0.0.1:${port}/login" >/dev/null
            curl --fail --silent "http://127.0.0.1:${port}/runtime-config.json" >/dev/null
            curl --fail --silent --head "http://127.0.0.1:${port}/runtime-config.json" | grep -i '^cache-control: no-store'
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/api/v1/session/context")" = 404
          done

          test "$(docker exec business-backoffice-smoke id -u)" != 0
          test "$(docker exec business-operational-smoke id -u)" != 0

      - name: Web container diagnostics and cleanup
        if: always()
        run: |
          docker logs business-backoffice-smoke 2>/dev/null || true
          docker logs business-operational-smoke 2>/dev/null || true
          docker rm --force business-backoffice-smoke business-operational-smoke 2>/dev/null || true
