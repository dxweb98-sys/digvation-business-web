name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, fix/human-readable-labels]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format copy cleanup branch
        if: github.ref == 'refs/heads/fix/human-readable-labels'
        run: |
          pnpm format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: format copy cleanup"
            git push
          fi

      - name: Verify foundation
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm verify

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
        run: pnpm test:e2e
