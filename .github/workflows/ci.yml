name: Baseline E2E Probe

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  baseline-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout baseline app code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run current E2E suite against dev application baseline
        env:
          VITE_BUILD_REVISION: baseline-e2e-probe
        run: pnpm test:e2e
