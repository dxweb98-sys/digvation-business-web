name: Frontend CI

on:
  push:
    branches: [feat/discount-promotion]

permissions:
  contents: read

jobs:
  verify-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check discount promotion formatting
        run: >-
          pnpm exec prettier --check
          apps/backoffice/src/app/router/backoffice-router.tsx
          apps/backoffice/src/app/shell/backoffice-shell.tsx
          apps/backoffice/src/auth/backoffice-access.test.ts
          apps/backoffice/src/auth/backoffice-access.ts
          apps/backoffice/src/modules/promotions/index.ts
          apps/backoffice/src/modules/promotions/promotions-api.ts
          apps/backoffice/src/modules/promotions/promotions-localization.ts
          apps/backoffice/src/modules/promotions/promotions-page.tsx
          apps/operational/src/features/sell/cashier-transaction-adapter-factory.ts
          apps/operational/src/features/sell/cashier-transaction.types.ts
          apps/operational/src/features/sell/components/sale-adjustment-controls.tsx
          apps/operational/src/features/sell/operational-projection-client.ts
          apps/operational/src/routes/sell/sell-page.tsx
          packages/runtime/src/authenticated-runtime-context.test.ts
          packages/runtime/src/authenticated-runtime-context.ts
          packages/runtime/src/runtime-config.schema.ts
          packages/runtime/src/runtime-config.types.ts

      - name: Unit tests
        run: pnpm test
