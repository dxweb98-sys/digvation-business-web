name: Temporary Operational POS Hardening

on:
  push:
    branches:
      - feat/operational-api-integration

permissions:
  contents: write

jobs:
  patch-and-typecheck:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operational-api-integration
          fetch-depth: 0
      - name: Apply targeted hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path_name, replacements):
              path = Path(path_name)
              text = path.read_text()
              for old, new, label in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_name} / {label}: expected 1 match, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          patch(
              'apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx',
              [
                  (
                      """  const openAdjustment = (transaction: Sale) => {\n    if (transaction.status !== 'OPEN') return;\n    setQueueDetail(null);\n    setAdjustmentTarget(transaction);\n    workspace.openQueueContext(transaction.id);\n  };""",
                      """  const openAdjustment = async (transaction: Sale) => {\n    if (transaction.status !== 'OPEN') return;\n    setQueueDetail(null);\n    try {\n      const hydrated = await workspace.hydrateQueuedSale(transaction.id);\n      setAdjustmentTarget(hydrated);\n    } catch {\n      showToast({\n        title: copy('Could not load transaction'),\n        description: copy('Reload the transaction before accepting payment.'),\n        variant: 'danger',\n      });\n    }\n  };""",
                      'hydrate before adjustment',
                  ),
                  (
                      """  const paid = hasSuccessfulPayment(sale);\n  const activeLines = sale.lines.filter((line) => line.removedAt === null);""",
                      """  const paid = hasSuccessfulPayment(sale);\n  const { totalPaid } = financialSummary(sale);\n  const paidAmount = createDecimal(totalPaid);\n  const saleTotal = createDecimal(sale.totalAmount);\n  const activeLines = sale.lines.filter((line) => line.removedAt === null);""",
                      'adjustment payment summary',
                  ),
                  (
                      """          {activeLines.map((line) => {\n            const canDecrease =\n              !paid && createDecimal(line.quantity).greaterThan(createDecimal('1'));\n            return (""",
                      """          {activeLines.map((line) => {\n            const lineMutable =\n              !line.fulfillment || line.fulfillment.status === 'WAITING';\n            const canDecrease =\n              !paid &&\n              lineMutable &&\n              createDecimal(line.quantity).greaterThan(createDecimal('1'));\n            const canRemove = !paid && lineMutable;\n            const projectedTotalAfterRemoval = saleTotal.minus(createDecimal(line.totalAmount));\n            const removalRefund = paidAmount.greaterThan(projectedTotalAfterRemoval)\n              ? paidAmount.minus(projectedTotalAfterRemoval)\n              : createDecimal('0');\n            return (""",
                      'adjustment line guards',
                  ),
                  (
                      """                  <p className=\"mt-0.5 text-xs text-[var(--color-text-muted)]\">\n                    {quantity(line.quantity)} × {money(line.effectiveUnitPrice, locale)}\n                  </p>""",
                      """                  <p className=\"mt-0.5 text-xs text-[var(--color-text-muted)]\">\n                    {quantity(line.quantity)} × {money(line.effectiveUnitPrice, locale)}\n                  </p>\n                  {paid && removalRefund.greaterThan(createDecimal('0')) ? (\n                    <p className=\"mt-1 text-[11px] font-semibold text-[var(--color-warning)]\">\n                      {copy('Refund required')}: {money(removalRefund.toFixed(4), locale)}\n                    </p>\n                  ) : null}""",
                      'adjustment refund indication',
                  ),
                  (
                      """                    disabled={isMutating}\n                    onClick={() =>\n                      onQuantity(\n                        line,\n                        createDecimal(line.quantity).plus(createDecimal('1')).toFixed(4),\n                      )\n                    }""",
                      """                    disabled={!lineMutable || isMutating}\n                    onClick={() =>\n                      onQuantity(\n                        line,\n                        createDecimal(line.quantity).plus(createDecimal('1')).toFixed(4),\n                      )\n                    }""",
                      'disable started-line increase',
                  ),
                  (
                      """                    disabled={paid || isMutating}\n                    onClick={() => onRemove(line)}""",
                      """                    disabled={!canRemove || isMutating}\n                    onClick={() => onRemove(line)}""",
                      'disable unsafe removal',
                  ),
              ],
          )

          patch(
              'apps/operational/src/features/sell/use-cashier-transaction-workspace.ts',
              [
                  (
                      """  const startSaleWork = async (sale: Sale) => {\n    const updated = await command.runMutation(() =>\n      transactionAdapter.startSaleWork(\n        sale.id,\n        sale.version,\n        `cashier-start-work-${crypto.randomUUID()}`,\n      ),\n    );""",
                      """  const startSaleWork = async (sale: Sale) => {\n    const authoritative = await transactionAdapter.getSale(sale.id);\n    const updated = await command.runMutation(() =>\n      transactionAdapter.startSaleWork(\n        authoritative.id,\n        authoritative.version,\n        `cashier-start-work-${crypto.randomUUID()}`,\n      ),\n    );""",
                      'authoritative start-work version',
                  ),
                  (
                      """    try {\n      const performers = contributors.length\n        ? contributors\n        : employeeIds.map((employeeId) => ({ employeeId }));\n      const updated = await command.runMutation(() =>\n        transactionAdapter.setSaleLinePerformers(sale.id, line.id, {\n          expectedVersion: sale.version,\n          performers,\n        }),\n      );""",
                      """    try {\n      const authoritative = await transactionAdapter.getSale(sale.id);\n      const liveLine = authoritative.lines.find(\n        (candidate) => candidate.id === line.id && candidate.removedAt === null,\n      );\n      if (!liveLine) throw new Error(copy('The service line is no longer available.'));\n      const performers = contributors.length\n        ? contributors\n        : employeeIds.map((employeeId) => ({ employeeId }));\n      const updated = await command.runMutation(() =>\n        transactionAdapter.setSaleLinePerformers(authoritative.id, liveLine.id, {\n          expectedVersion: authoritative.version,\n          performers,\n        }),\n      );""",
                      'authoritative worker assignment version',
                  ),
              ],
          )
          PY
      - name: Install workspace
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Typecheck Operational
        run: pnpm --filter @digvation/business-operational-pos typecheck
      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/temp-operational-pos-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/operational/src/features/sell/components/replatformed-pos-workspace.tsx apps/operational/src/features/sell/use-cashier-transaction-workspace.ts .github/workflows/temp-operational-pos-hardening.yml
          git commit -m "fix(operational): harden queue adjustment and worker flow"
          git push origin HEAD:feat/operational-api-integration
